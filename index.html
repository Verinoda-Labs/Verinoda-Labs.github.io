<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verinoda Labs</title>
<meta name="description" content="Verinoda Labs builds open-source tools that help AI coding agents work from evidence: fewer guesses, answers you can verify, and a clear view of what they cost.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="canonical" href="https://verinoda-labs.github.io/">
<meta name="theme-color" content="#f3f2f2">
<meta property="og:type" content="website">
<meta property="og:title" content="Verinoda Labs">
<meta property="og:description" content="Open-source tools for evidence-first, cost-aware AI development.">
<meta property="og:url" content="https://verinoda-labs.github.io/">
<meta property="og:image" content="https://verinoda-labs.github.io/banner.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="styles.css">
<style>
/* Orchid accent over the Modernist tokens */
:root{
--color-accent:oklch(60% .2 325);
--color-accent-100:oklch(97% .018 325);--color-accent-200:oklch(93% .045 325);--color-accent-300:oklch(87% .08 325);
--color-accent-400:oklch(78% .13 325);--color-accent-500:oklch(66% .19 325);--color-accent-600:oklch(55% .2 325);
--color-accent-700:oklch(46% .18 325);--color-accent-800:oklch(37% .14 325);--color-accent-900:oklch(27% .09 325);
--color-accent-2:oklch(66% .19 325);
--ease:cubic-bezier(.22,1,.36,1);
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html{scroll-behavior:smooth}
a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-600)}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text)}
main{flex:1;transition:opacity .38s var(--ease),transform .38s var(--ease)}
main.fading{opacity:0;transform:translate3d(0,10px,0)}
.wrap{max-width:1240px;margin:0 auto;padding-left:32px;padding-right:32px}
.sq{width:14px;height:14px;background:var(--color-accent);display:block}.sq.sm{width:10px;height:10px}.sq.big-sq{width:40px;height:40px;margin-bottom:28px}
.skip{position:absolute;left:-999px;top:8px;background:var(--color-text);color:var(--color-bg);padding:8px 12px;z-index:50}.skip:focus{left:8px}

/* nav */
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--color-bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--color-divider)}
.nav-in{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--color-text);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{color:var(--color-text)}
.nav-right,.nav-links,.nav-actions{display:flex;align-items:center;flex-wrap:wrap}
.nav-right{gap:24px}.nav-links{gap:20px;font-size:14px;font-weight:600}.nav-actions{gap:12px}
.nav-links a{color:var(--color-text);text-decoration:none;white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent;transition:border-color .35s ease}
.nav-links a[aria-current=page]{border-bottom-color:var(--color-accent)}
.lang{display:flex;border:2px solid var(--color-text)}
.lang button{font:800 12px/1 var(--font-body);letter-spacing:.06em;padding:6px 10px;border:0;cursor:pointer;background:transparent;color:var(--color-text);transition:background .3s ease,color .3s ease}
.lang button[aria-pressed=true]{background:var(--color-text);color:var(--color-bg)}

/* type */
.h-hero{font-size:clamp(44px,6.4vw,88px);line-height:.98;letter-spacing:-.035em;margin:0 0 28px;text-wrap:balance}
.h-prod{font-size:clamp(52px,8vw,120px);line-height:.94;letter-spacing:-.045em;margin:0 0 32px}
.h-page{font-size:clamp(40px,5.6vw,76px);line-height:.98;letter-spacing:-.04em;margin:0;text-wrap:balance}
.h-sec{font-size:clamp(32px,4vw,52px);letter-spacing:-.03em;margin:0;text-wrap:balance}
.h-sec2{font-size:clamp(30px,3.6vw,46px);letter-spacing:-.03em;margin:0 0 40px;max-width:720px;text-wrap:balance}
.h-cta{font-size:clamp(44px,7vw,104px);line-height:.96;letter-spacing:-.04em;margin:0 0 48px;max-width:1000px;color:var(--color-bg);text-wrap:balance}
.kick{color:var(--color-accent-700);margin-bottom:16px}
.lead-xl{font-size:19px;line-height:1.55;max-width:560px;margin:0 0 36px;color:var(--color-neutral-800);text-wrap:pretty}
.lead-m{font-size:22px;line-height:1.45;margin:0 0 20px;font-weight:600;letter-spacing:-.01em;text-wrap:pretty}
.body-l{font-size:16px;line-height:1.6;color:var(--color-neutral-800);margin:0 0 28px;max-width:560px;text-wrap:pretty}
.body-m{font-size:15px;line-height:1.6;color:var(--color-neutral-800);margin:0;text-wrap:pretty}
.muted-s{font-size:13px;color:var(--color-neutral-700)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.tag{white-space:nowrap;flex-shrink:0}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-lg{white-space:nowrap;padding:14px 20px;min-width:200px;justify-content:space-between;gap:24px;font-size:15px}

/* layout blocks */
.hero{padding-top:96px;padding-bottom:80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:64px;align-items:center}
.sec{padding-top:112px;padding-bottom:96px}.sec-head{max-width:760px;margin-bottom:48px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px}.two.end{align-items:end}.two.top{align-items:start}
.two.ruled{padding-top:32px;border-top:2px solid var(--color-text)}
.two2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.band{background:var(--color-surface);border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.band .sec{padding-top:104px;padding-bottom:104px}
.topline{border-top:2px solid var(--color-divider)}
.dark{background:var(--color-text);color:var(--color-neutral-200)}
.dark-p{font-size:16px;line-height:1.6;color:var(--color-neutral-400);margin:0;max-width:480px}
.ruled-top{border-top:2px solid var(--color-text)}
.ruled-h{font-size:20px;margin:0 0 20px;padding-bottom:14px;border-bottom:2px solid var(--color-text)}

/* terminal */
.term{background:var(--color-text);color:var(--color-neutral-200);box-shadow:var(--shadow-lg)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--color-neutral-800);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-500)}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;background:var(--color-neutral-700)}.dots i:first-child{background:var(--color-accent)}
.term-body{padding:24px 22px 28px;font:13.5px/1.75 var(--mono);min-height:300px}
.tl{white-space:pre-wrap;word-break:break-word;opacity:0;transform:translateY(6px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.tl.on{opacity:1;transform:none}
.k-cmd{color:var(--color-neutral-100)}.k-txt{color:var(--color-neutral-300)}.k-ok{color:var(--color-accent-400)}.k-warn,.k-dim{color:var(--color-neutral-500)}

/* stats */
.stats{border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.stats-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));padding:0}
.stat{padding:36px 32px;border-right:2px solid var(--color-divider);margin-right:-2px}
.stat-v{font-size:clamp(36px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--color-accent)}
.stat-l{margin-top:14px;font-size:14px;line-height:1.45;color:var(--color-neutral-800);text-wrap:pretty}

/* cards, steps, features */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px}
.pcard{display:flex;flex-direction:column;gap:18px;padding:36px;background:var(--color-surface);color:var(--color-text);text-decoration:none;border-top:3px solid var(--color-accent);transition:background .45s var(--ease),box-shadow .45s var(--ease),transform .45s var(--ease)}
.pcard:hover{background:var(--color-neutral-100);box-shadow:var(--shadow-md);transform:translateY(-4px);color:var(--color-text)}
.pcard h3{font-size:clamp(28px,3vw,38px);letter-spacing:-.025em;margin:0}
.pcard p{font-size:16px;line-height:1.6;color:var(--color-neutral-800);margin:0;flex:1;text-wrap:pretty}
.tag.tag-neutral{align-self:flex-start}
.pcard-cta{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding-top:18px;border-top:2px solid var(--color-divider)}.acc{color:var(--color-accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));border-top:2px solid var(--color-text)}
.step{padding:28px 28px 8px 0}
.step-n{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--color-neutral-400);margin-bottom:24px}
.step h4,.feat h4{font-size:19px;margin:0 0 10px}
.step p,.feat p{font-size:14.5px;line-height:1.6;color:var(--color-neutral-800);margin:0 0 14px;text-wrap:pretty}
.step code{font:12.5px var(--mono);color:var(--color-accent-700)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:2px solid var(--color-divider)}
.feat{padding:32px 28px 36px 0;border-bottom:2px solid var(--color-divider);transition:background .45s var(--ease)}
.feat:hover{background:var(--color-neutral-200)}
.feat p{margin:0;padding-right:16px}
.feat-n{font-size:12px;font-weight:800;color:var(--color-accent-700);letter-spacing:.08em;margin-bottom:14px}

/* product page */
.phero{padding-top:88px;padding-bottom:72px}
.crumb{display:flex;gap:10px;align-items:center;font-size:13px;margin-bottom:28px;color:var(--color-neutral-700)}.crumb a{color:var(--color-neutral-700);text-decoration:none}.crumb b{color:var(--color-text);font-weight:600}
.notes{background:var(--color-surface);padding:28px 28px 8px;align-self:start}.notes h6{margin-bottom:16px;color:var(--color-neutral-700)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--color-neutral-300);font-size:14px;line-height:1.5}
.kv.thin{border-top:0;border-bottom:1px solid var(--color-neutral-300)}.kv .k{font-weight:800}.kv .v{color:var(--color-neutral-800)}
.codelist{font:13.5px/2 var(--mono);border-top:1px solid var(--color-neutral-800);padding-top:20px}
.crow{display:grid;padding:6px 0;border-bottom:1px solid var(--color-neutral-800)}.ccmd{color:var(--color-neutral-100);word-break:break-word}.prompt{color:var(--color-accent-400)}
.cnote{font:13px/1.5 var(--font-body);color:var(--color-neutral-500);padding-bottom:6px}

/* benchmarks */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.tab{text-align:left;font-family:var(--font-body);padding:18px 20px;border:0;border-right:2px solid var(--color-divider);cursor:pointer;background:transparent;color:var(--color-text);transition:background .4s var(--ease),color .4s ease}
.tab[aria-pressed=true]{background:var(--color-text);color:var(--color-bg)}
.tab-n{font-weight:800;font-size:15px;margin-bottom:4px}.tab-m{font-size:12.5px}
.bench-cols{gap:56px;padding:48px 0 56px;border-bottom:2px solid var(--color-divider);grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr))}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap}.col-head h4{margin:0}
.bars{display:flex;flex-direction:column;gap:18px}
.bar-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px;gap:12px}.bar-val{font-weight:800;font-variant-numeric:tabular-nums}
.bar-track{height:14px;background:var(--color-neutral-200)}
.bar-fill{height:100%;width:0;background:var(--color-neutral-600);transition:width 1.1s var(--ease) .2s}.bar-fill.ours{background:var(--color-accent)}
.big{margin-top:32px;padding-top:20px;border-top:1px solid var(--color-neutral-300);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.big-v{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--color-accent);line-height:1}.big-t{font-size:14px;line-height:1.5;color:var(--color-neutral-800);flex:1;min-width:200px}
.mid{color:var(--color-neutral-800)}
.method{font-size:13px;line-height:1.6;color:var(--color-neutral-700);margin:24px 0 0;max-width:820px;text-wrap:pretty}
.teaser{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px;align-items:end;padding-top:104px;padding-bottom:104px}

/* install */
.inst{background:var(--color-text);color:var(--color-neutral-200);box-shadow:var(--shadow-md)}
.inst-tabs{display:flex;border-bottom:1px solid var(--color-neutral-800);flex-wrap:wrap;padding:0 12px}
.inst-tabs button{font:800 13px var(--font-body);padding:14px 16px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--color-neutral-500);transition:color .3s ease,border-color .3s ease}
.inst-tabs button[aria-pressed=true]{color:var(--color-neutral-100);border-bottom-color:var(--color-accent-400)}
.inst-cmd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 28px}
.inst-cmd code{font:15px var(--mono);color:var(--color-neutral-100);word-break:break-all}
#copy{flex-shrink:0;font:800 12px var(--font-body);padding:8px 12px;background:transparent;color:var(--color-neutral-200);border:1px solid var(--color-neutral-700);cursor:pointer;min-width:96px;text-align:left;white-space:nowrap;transition:background .3s ease}#copy:hover{background:var(--color-neutral-800)}
.qrow{padding:14px 0;border-bottom:1px solid var(--color-neutral-300)}.qrow code{font:13.5px var(--mono);color:var(--color-accent-700);word-break:break-word}.qrow div{font-size:14px;line-height:1.5;color:var(--color-neutral-800);margin-top:4px}

/* contact */
.reason{padding:16px 0;border-bottom:1px solid var(--color-neutral-300);font-size:14px;line-height:1.5;color:var(--color-neutral-800)}.rk{font-weight:800;font-size:15px;margin-bottom:4px;color:var(--color-text)}
.formbox{background:var(--color-surface);padding:36px;box-shadow:var(--shadow-sm)}
.topics{display:flex;flex-wrap:wrap;border:1px solid var(--color-divider)}
.topics button{flex:1 1 auto;text-align:left;font:13px var(--font-body);padding:9px 12px;border:0;cursor:pointer;white-space:nowrap;background:transparent;color:var(--color-text);transition:background .3s ease,color .3s ease}
.topics button[aria-pressed=true]{background:var(--color-accent);color:var(--color-bg)}
.input{min-height:42px}
.err{font-size:13px;color:var(--color-accent-700);min-height:18px}

/* cta + footer */
.cta{background:var(--color-accent);color:var(--color-bg)}
.cta-row{display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap;padding-top:28px;border-top:2px solid var(--color-bg)}
.cta-row p{font-size:17px;line-height:1.55;margin:0;max-width:520px;color:var(--color-bg)}
.cta-a,.cta-b{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 18px;font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .3s ease}
.cta-a{min-width:220px;background:var(--color-bg);color:var(--color-text)}.cta-a:hover{background:var(--color-neutral-200);color:var(--color-text)}
.cta-b{min-width:180px;border:2px solid var(--color-bg);color:var(--color-bg)}.cta-b:hover{background:var(--color-accent-600);color:var(--color-bg)}
footer{border-top:2px solid var(--color-divider)}
.foot{padding-top:32px;padding-bottom:32px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--color-neutral-700)}
.foot-brand{display:flex;align-items:center;gap:10px}.foot-brand b{color:var(--color-text)}.foot-links{display:flex;gap:20px;flex-wrap:wrap}

/* reveal */
[data-reveal].pre{opacity:0;transform:translate3d(0,28px,0)}
[data-reveal].pre.in{opacity:1;transform:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}

@media (max-width:640px){.wrap{padding-left:20px;padding-right:20px}.hero{padding-top:56px;gap:40px}.sec{padding-top:72px;padding-bottom:64px}.formbox{padding:24px}.stat{padding:28px 20px}.kv{grid-template-columns:96px minmax(0,1fr)}.pcard{padding:24px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{[data-reveal]{opacity:1!important;transform:none!important}nav.top{position:static}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p style="padding:32px;font-family:system-ui">Verinoda Labs builds open-source, evidence-first tools for AI coding agents. Enable JavaScript to view this site, or visit <a href="https://github.com/Verinoda-Labs">github.com/Verinoda-Labs</a>.</p></noscript>
<script src="analytics.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
